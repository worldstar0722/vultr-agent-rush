# Usage:  cp .env.example .env  &&  docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    environment:
      # The container always uses the volume path, whatever DB_PATH says in .env
      DB_PATH: /data/gradecase.db
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - gradecase_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ":-" means: use ":80" when DOMAIN is unset OR empty (plain HTTP on the server IP).
      SITE_ADDRESS: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gradecase_data:
  caddy_data:
  caddy_config:
