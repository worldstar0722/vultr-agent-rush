<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GradeCase</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="banner" role="status">
    Synthetic demo data. No real student records. No grades are changed and no messages are sent.
  </div>
  <header class="top">
    <div class="brand">
      <strong id="name">GradeCase</strong>
      <span id="tagline" class="muted"></span>
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="role" role="group" aria-label="Demo role switch">
      <span class="muted small">Demo role switch - not real access control</span>
      <button id="role-ta" type="button">TA</button>
      <button id="role-professor" type="button">Professor</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="small muted">
    <span id="mode"></span>
    <button id="reset" type="button" class="link">Reset demo data</button>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
