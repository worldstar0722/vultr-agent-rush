#cloud-config
# Ubuntu 24.04 user-data: installs Docker, clones the repo, starts the stack.
# Paste into the "Cloud-Init User-Data" field when creating the instance (verify the exact
# field name in the Vultr console). Put NO secrets here: user-data is not a safe place.
# SSH in afterwards and edit /opt/gradecase/.env to add an inference key.
package_update: true
packages:
  - git
  - curl
  - ca-certificates

write_files:
  - path: /etc/gradecase-deploy.env
    permissions: "0644"
    content: |
      # BRANCH: currently the PR branch. Switch to "main" after the PR is merged.
      BRANCH=claude/ecstatic-newton-ck2lvo
      REPO_URL=https://github.com/worldstar0722/vultr-agent-rush.git

runcmd:
  # Official Docker convenience script (installs engine + compose plugin)
  - curl -fsSL https://get.docker.com | sh
  # The repo must be public for an unauthenticated clone.
  - |
    . /etc/gradecase-deploy.env
    git clone --branch "$BRANCH" "$REPO_URL" /opt/gradecase
  - cp /opt/gradecase/.env.example /opt/gradecase/.env
  # Only matters if ufw is enabled on this image. Harmless otherwise.
  - |
    if ufw status | grep -q "Status: active"; then
      ufw allow 22/tcp; ufw allow 80/tcp; ufw allow 443/tcp; ufw allow 443/udp
    fi
  - cd /opt/gradecase && docker compose up -d --build
