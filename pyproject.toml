[project]
name = "vultr-agent-rush"
version = "0.1.0"
description = "Topic-agnostic starter for the Vultr: Agent Rush hackathon"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
